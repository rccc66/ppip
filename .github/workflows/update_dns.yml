name: PPIP Auto Update DNS

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  update_dns:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Script Exists
        run: |
          if [ ! -f "update_dns.py" ]; then
            echo "❌ 未找到 update_dns.py"
            exit 1
          fi
          echo "✅ 找到 update_dns.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_dns.py
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
          CLOUDFLARE_DNS_NAME: ${{ secrets.CLOUDFLARE_DNS_NAME }}
          PPIP_SOURCE_DOMAIN: ${{ secrets.PPIP_SOURCE_DOMAIN }}
          PPIP_CHECK_LIMIT: ${{ secrets.PPIP_CHECK_LIMIT }}
          PPIP_CONCURRENCY: ${{ secrets.PPIP_CONCURRENCY }}
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            echo "=============================="
            echo "开始执行任务，第 $((n+1)) 次"
            echo "=============================="

            python update_dns.py
            code=$?

            echo "脚本退出码: $code"
            if [ "$code" -eq 0 ]; then
              echo "任务成功"
              break
            fi

            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "连续 3 次失败，不再重试"
              break
            fi

            wait_time=$((60 + n * 60))
            echo "任务失败，准备 ${wait_time}s 后重试..."
            sleep "$wait_time"
          done

          if [ "$n" -ge 3 ]; then
            echo "最终失败"
            exit 1
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            *.txt
            *.log
            *.csv
          if-no-files-found: ignore
          retention-days: 7
